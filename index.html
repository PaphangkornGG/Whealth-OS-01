<!doctype html>

<head>
<meta charset="utf-8" />

<title>Wealth OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Light Bento theme. The "ink-*" scale is intentionally LIGHT-mapped
  // so legacy dark-theme components from earlier iterations get re-skinned
  // for free (ink-0 = page bg, ink-50 = card, ink-700/800 = dark text).
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'Noto Sans Thai', 'ui-sans-serif', 'system-ui'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
        colors: {
          // Bento-native names
          bg:    'oklch(0.92 0.005 250)',
          card:  'oklch(0.99 0.002 250)',
          line:  'oklch(0.90 0.005 250)',
          line2: 'oklch(0.85 0.006 250)',
          surface: {
            inverse: 'oklch(0.18 0.01 250)',
            soft:    'oklch(0.95 0.005 250)',
          },
          lime:   'oklch(0.85 0.18 130)',
          // Legacy "ink" scale (re-mapped LIGHT)
          ink: {
            0:   'oklch(0.92 0.005 250)',  // page bg
            50:  'oklch(0.99 0.002 250)',  // card bg
            100: 'oklch(0.95 0.005 250)',  // raised / pill bg
            200: 'oklch(0.90 0.005 250)',  // hairline
            300: 'oklch(0.85 0.006 250)',  // stronger border
            400: 'oklch(0.65 0.012 250)',  // very muted text
            500: 'oklch(0.52 0.012 250)',  // muted text
            600: 'oklch(0.40 0.012 250)',
            700: 'oklch(0.25 0.01 250)',
            800: 'oklch(0.15 0.01 250)',   // primary text
            900: 'oklch(0.08 0.01 250)',
          },
          // Accents — used by both bento + legacy components
          brand:  { DEFAULT: 'oklch(0.55 0.22 264)', soft: 'oklch(0.55 0.22 264 / 0.12)' },
          gain:   { DEFAULT: 'oklch(0.62 0.18 145)', soft: 'oklch(0.62 0.18 145 / 0.14)' },
          loss:   { DEFAULT: 'oklch(0.62 0.22 28)',  soft: 'oklch(0.62 0.22 28 / 0.12)' },
          warn:   { DEFAULT: 'oklch(0.72 0.16 75)',  soft: 'oklch(0.72 0.16 75 / 0.14)' },
          violet: { DEFAULT: 'oklch(0.55 0.20 295)', soft: 'oklch(0.55 0.20 295 / 0.14)' },
        },
        boxShadow: {
          'card': '0 1px 2px 0 oklch(0 0 0 / 0.04), 0 0 0 1px oklch(0 0 0 / 0.04)',
          'pop':  '0 12px 32px -8px oklch(0 0 0 / 0.18), 0 4px 8px -2px oklch(0 0 0 / 0.08)',
        },
      },
    },
  };
</script>
<style>
  html, body { background: oklch(0.92 0.005 250); }
  body {
    font-family: 'Inter', 'Noto Sans Thai', ui-sans-serif, system-ui;
    color: oklch(0.15 0.01 250);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv11', 'ss01';
  }
  .num, .font-mono { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  ::selection { background: oklch(0.55 0.22 264 / 0.18); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes scaleIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  .scale-in { animation: scaleIn .18s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade-in { animation: fadeIn .2s ease both; }

  input[type=range] { -webkit-appearance: none; height: 4px; background: oklch(0.88 0.005 250); border-radius: 999px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: oklch(0.55 0.22 264); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: oklch(0.78 0.008 250); border-radius: 3px; }

  /* Sparkline */
  .spark { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
